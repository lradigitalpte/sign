root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/api.exe ./cmd/api"
entrypoint = ["./tmp/api.exe"]
delay = 500
exclude_dir = ["apps", "tmp", "vendor"]
include_ext = ["go", "sql", "yaml"]
kill_delay = "500ms"
# Windows can't deliver interrupt signals, so air must kill the old process outright
# (otherwise the old API keeps port 8085 and every rebuild fails to start).
send_interrupt = false
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true
