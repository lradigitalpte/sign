root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/api.exe ./cmd/api"
entrypoint = ["./tmp/api.exe"]
delay = 500
exclude_dir = ["apps", "tmp", "vendor"]
include_ext = ["go", "sql", "yaml"]
kill_delay = "500ms"
send_interrupt = true
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true
