services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: signing
      POSTGRES_USER: signing
      POSTGRES_PASSWORD: signing
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signing -d signing"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - signing_postgres_data:/var/lib/postgresql/data
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: signing
      MINIO_ROOT_PASSWORD: signing-development-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - signing_minio_data:/data
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  signing_postgres_data:
  signing_minio_data:
